# ==========================================================================
#  docker-compose.yml  ·  Proyecto Cátedras · Versiones 1 a 5
# --------------------------------------------------------------------------
#  El Artículo 4 de la constitución manda "un solo comando":
#      docker compose up -d --build
#  ...deja TODO el sistema de la versión funcionando.
#
#  Desde la v1 ese "todo" son TRES servicios (la v5 no agrega ninguno ni
#  cambia el nombre del proyecto: así el volumen de datos sigue siendo el mismo):
#      postgres  -> la base de datos (se siembra sola con el script provisto)
#      api       -> la API .NET, con 'dotnet watch' (recarga al guardar)
#      front     -> el front en Flask, que consume la API por HTTP
# ==========================================================================

# 'name' fija el nombre del PROYECTO Compose (prefijo de contenedores, redes
# y volúmenes). Con un nombre propio, este proyecto NO choca con el del
# curso aunque las carpetas se llamen parecido.
name: mi_v1_catedras

services:

  # ======================================================================
  #  Base de datos PostgreSQL
  # ======================================================================
  postgres:
    # Imagen oficial de PostgreSQL 16, variante 'alpine' (Linux mínimo).
    # El script provisto exige PostgreSQL 16 o superior.
    image: postgres:16-alpine

    container_name: mi_v1_catedras_postgres
    restart: unless-stopped

    # Variables que la imagen lee la PRIMERA vez para crear la base y el
    # usuario. Credenciales DIDÁCTICAS (constitución, Art. 8).
    environment:
      POSTGRES_DB: bdcatedras_postgres_local
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: Construccion123!

    # "HOST:CONTENEDOR". Dentro de la red de Docker PostgreSQL escucha en el
    # 5432 estándar; desde tu PC se entra por 15542 (+100 respecto a los
    # documentos, para convivir con el proyecto del curso).
    ports:
      - "15542:5432"

    volumes:
      # Persistencia en un volumen NOMBRADO (ver 'volumes' abajo).
      - pgdata:/var/lib/postgresql/data
      # El script PROVISTO, montado de solo lectura en la carpeta mágica.
      # PostgreSQL lo ejecuta la PRIMERA vez que arranca con el volumen
      # vacío. Se monta, NO se genera ni se modifica (5_data_model.md §4).
      - ./db/postgres/script_bdcatedras.sql:/docker-entrypoint-initdb.d/script_bdcatedras.sql:ro
      # Migraciones PROPIAS del proyecto (Guía IA, Regla 1): se ejecutan
      # DESPUÉS del script provisto porque initdb corre los archivos en
      # orden ALFABÉTICO y 'z001_' va después de 'script_'. Sin ese
      # prefijo, '001_...' correría PRIMERO y fallaría (aún no hay tablas).
      # Solo corren con el volumen vacío; con una BD ya creada se aplican
      # a mano (ver docs/spec_kit/Versiones/version2/7_quickstart.md).
      - ./db/postgres/migraciones/001_sp_guardar_programa_academico.sql:/docker-entrypoint-initdb.d/z001_sp_guardar_programa_academico.sql:ro
      # V3: los 2 SP maestro-detalle de la versión (asistente + sus 4
      # detalles; cierre del lote de carga + novedades). Mismo mecanismo:
      # 'z002_' y 'z003_' corren después de 'script_' y de 'z001_'.
      - ./db/postgres/migraciones/002_sp_guardar_asistente.sql:/docker-entrypoint-initdb.d/z002_sp_guardar_asistente.sql:ro
      - ./db/postgres/migraciones/003_sp_guardar_lote_carga.sql:/docker-entrypoint-initdb.d/z003_sp_guardar_lote_carga.sql:ro
      # V6: el primer SP nuevo desde la v3 (pregunta + sus opciones
      # iniciales). 'respuesta_encuesta'/'respuesta_item' NO necesitan
      # migración: usan fn_responder_encuesta_api, que ya trae el script
      # provisto desde la v1 (ADR D30). 'z004_' corre después de 'z003_'.
      - ./db/postgres/migraciones/004_sp_guardar_pregunta.sql:/docker-entrypoint-initdb.d/z004_sp_guardar_pregunta.sql:ro
      # Retrofit criterio 3 (VERSION_2.md §4) — prueba de concepto sobre
      # 'sede': los 5 verbos por procedimiento. Ver PLAN_RETROFIT_SP.md.
      - ./db/postgres/migraciones/005_sp_sede_ejemplo.sql:/docker-entrypoint-initdb.d/z005_sp_sede_ejemplo.sql:ro
      # Retrofit criterio 3 — este lote: Facultad, Dependencia,
      # ProgramaAcademico, AliasPrograma, Catedra, Sesion, Ponencia,
      # Parametro, Bitacora (una migración por tabla). 'z006_'..'z014_'
      # corren después de 'z005_' (orden alfabético de initdb).
      # OJO: initdb solo corre con el volumen VACÍO. Con una BD ya creada
      # hay que recrearla ('docker compose down -v') o aplicar cada archivo
      # a mano con psql.
      - ./db/postgres/migraciones/006_sp_facultad.sql:/docker-entrypoint-initdb.d/z006_sp_facultad.sql:ro
      - ./db/postgres/migraciones/007_sp_dependencia.sql:/docker-entrypoint-initdb.d/z007_sp_dependencia.sql:ro
      - ./db/postgres/migraciones/008_sp_programa_academico.sql:/docker-entrypoint-initdb.d/z008_sp_programa_academico.sql:ro
      - ./db/postgres/migraciones/009_sp_alias_programa.sql:/docker-entrypoint-initdb.d/z009_sp_alias_programa.sql:ro
      - ./db/postgres/migraciones/010_sp_catedra.sql:/docker-entrypoint-initdb.d/z010_sp_catedra.sql:ro
      - ./db/postgres/migraciones/011_sp_sesion.sql:/docker-entrypoint-initdb.d/z011_sp_sesion.sql:ro
      - ./db/postgres/migraciones/012_sp_ponencia.sql:/docker-entrypoint-initdb.d/z012_sp_ponencia.sql:ro
      - ./db/postgres/migraciones/013_sp_parametro.sql:/docker-entrypoint-initdb.d/z013_sp_parametro.sql:ro
      - ./db/postgres/migraciones/014_sp_bitacora.sql:/docker-entrypoint-initdb.d/z014_sp_bitacora.sql:ro
      # Retrofit criterio 3 · Fase 2 (catálogos simples): los 5 verbos por
      # procedimiento, mismo molde de 'sede'. Uno por tabla, z015_..z023_
      # (006-014 ya los usa el lote de arriba).
      - ./db/postgres/migraciones/015_sp_encuesta.sql:/docker-entrypoint-initdb.d/z015_sp_encuesta.sql:ro
      - ./db/postgres/migraciones/016_sp_estado_proceso.sql:/docker-entrypoint-initdb.d/z016_sp_estado_proceso.sql:ro
      - ./db/postgres/migraciones/017_sp_modalidad.sql:/docker-entrypoint-initdb.d/z017_sp_modalidad.sql:ro
      - ./db/postgres/migraciones/018_sp_periodo_academico.sql:/docker-entrypoint-initdb.d/z018_sp_periodo_academico.sql:ro
      - ./db/postgres/migraciones/019_sp_rol.sql:/docker-entrypoint-initdb.d/z019_sp_rol.sql:ro
      - ./db/postgres/migraciones/020_sp_tipo_documento.sql:/docker-entrypoint-initdb.d/z020_sp_tipo_documento.sql:ro
      - ./db/postgres/migraciones/021_sp_tipo_evento.sql:/docker-entrypoint-initdb.d/z021_sp_tipo_evento.sql:ro
      - ./db/postgres/migraciones/022_sp_tipo_pregunta.sql:/docker-entrypoint-initdb.d/z022_sp_tipo_pregunta.sql:ro
      - ./db/postgres/migraciones/023_sp_tipo_vinculacion.sql:/docker-entrypoint-initdb.d/z023_sp_tipo_vinculacion.sql:ro
      # Retrofit criterio 3 · Fase 4 (Isaac): las 7 tablas de la v3 + la v7
      # (LoteMigracion, DetalleMigracion). Una migración por tabla.
      # Renumeradas al fusionar ramas: eran 006-014 y chocaban con el lote
      # de arriba, ahora son 024-032 ('z024_'..'z032_', después de 'z023_').
      # 'z031_' necesita a sp_generar_lote_migracion, que ya trae el script.
      - ./db/postgres/migraciones/024_sp_asistente.sql:/docker-entrypoint-initdb.d/z024_sp_asistente.sql:ro
      - ./db/postgres/migraciones/025_sp_documento_asistente.sql:/docker-entrypoint-initdb.d/z025_sp_documento_asistente.sql:ro
      - ./db/postgres/migraciones/026_sp_vinculacion_asistente.sql:/docker-entrypoint-initdb.d/z026_sp_vinculacion_asistente.sql:ro
      - ./db/postgres/migraciones/027_sp_programa_asistente.sql:/docker-entrypoint-initdb.d/z027_sp_programa_asistente.sql:ro
      - ./db/postgres/migraciones/028_sp_consentimiento_datos.sql:/docker-entrypoint-initdb.d/z028_sp_consentimiento_datos.sql:ro
      - ./db/postgres/migraciones/029_sp_lote_carga_asistente.sql:/docker-entrypoint-initdb.d/z029_sp_lote_carga_asistente.sql:ro
      - ./db/postgres/migraciones/030_sp_novedad_carga.sql:/docker-entrypoint-initdb.d/z030_sp_novedad_carga.sql:ro
      - ./db/postgres/migraciones/031_sp_lote_migracion.sql:/docker-entrypoint-initdb.d/z031_sp_lote_migracion.sql:ro
      - ./db/postgres/migraciones/032_sp_detalle_migracion.sql:/docker-entrypoint-initdb.d/z032_sp_detalle_migracion.sql:ro
      # Retrofit criterio 3 · lote Fases 5-6 (v5 + v6): los SP de usuario,
      # rol_por_usuario, enlace_registro, clave_acceso, registro_asistencia,
      # pregunta, opcion_pregunta, respuesta_encuesta y respuesta_item.
      # Ver docs/spec_kit/Versiones/AJUSTES_RETROFIT_SP_LOTE_FASE5.md.
      # Renumeradas al fusionar ramas: eran 006-014 y chocaban con los lotes
      # de arriba, ahora son 033-041 ('z033_'..'z041_', después de 'z032_').
      # Son independientes entre sí (CREATE OR REPLACE): el orden solo
      # importa respecto a 'script_' y a z004 (sp_guardar_pregunta).
      - ./db/postgres/migraciones/033_sp_usuario.sql:/docker-entrypoint-initdb.d/z033_sp_usuario.sql:ro
      - ./db/postgres/migraciones/034_sp_rol_por_usuario.sql:/docker-entrypoint-initdb.d/z034_sp_rol_por_usuario.sql:ro
      - ./db/postgres/migraciones/035_sp_enlace_registro.sql:/docker-entrypoint-initdb.d/z035_sp_enlace_registro.sql:ro
      - ./db/postgres/migraciones/036_sp_clave_acceso.sql:/docker-entrypoint-initdb.d/z036_sp_clave_acceso.sql:ro
      - ./db/postgres/migraciones/037_sp_registro_asistencia.sql:/docker-entrypoint-initdb.d/z037_sp_registro_asistencia.sql:ro
      - ./db/postgres/migraciones/038_sp_pregunta.sql:/docker-entrypoint-initdb.d/z038_sp_pregunta.sql:ro
      - ./db/postgres/migraciones/039_sp_opcion_pregunta.sql:/docker-entrypoint-initdb.d/z039_sp_opcion_pregunta.sql:ro
      - ./db/postgres/migraciones/040_sp_respuesta_encuesta.sql:/docker-entrypoint-initdb.d/z040_sp_respuesta_encuesta.sql:ro
      - ./db/postgres/migraciones/041_sp_respuesta_item.sql:/docker-entrypoint-initdb.d/z041_sp_respuesta_item.sql:ro
      # Maestro-detalle en el formulario (Guía IA, Reglas 1 y 4): el maestro y
      # sus detalles se guardan en UN solo CALL. Reutilizan procedimientos de
      # arriba (z004, z010, z011) y sp_emitir_enlace del script, así que van
      # al final: 'z042_'..'z044_'.
      - ./db/postgres/migraciones/042_sp_guardar_catedra.sql:/docker-entrypoint-initdb.d/z042_sp_guardar_catedra.sql:ro
      - ./db/postgres/migraciones/043_sp_guardar_encuesta.sql:/docker-entrypoint-initdb.d/z043_sp_guardar_encuesta.sql:ro
      - ./db/postgres/migraciones/044_sp_guardar_sesion.sql:/docker-entrypoint-initdb.d/z044_sp_guardar_sesion.sql:ro
      # Subversión v7.1 (geolocalización, cuentas de estudiante/ponente,
      # recuperar clave, estudiante semilla). 045 reemplaza los SP de 037;
      # 048 necesita 002, 033 y 046. Con un volumen ya creado se aplican a
      # mano (ver README, "Subversión v7.1").
      - ./db/postgres/migraciones/045_geolocalizacion_registro.sql:/docker-entrypoint-initdb.d/z045_geolocalizacion_registro.sql:ro
      - ./db/postgres/migraciones/046_roles_estudiante_ponente.sql:/docker-entrypoint-initdb.d/z046_roles_estudiante_ponente.sql:ro
      - ./db/postgres/migraciones/047_codigo_recuperacion.sql:/docker-entrypoint-initdb.d/z047_codigo_recuperacion.sql:ro
      - ./db/postgres/migraciones/048_semilla_estudiante.sql:/docker-entrypoint-initdb.d/z048_semilla_estudiante.sql:ro
      - ./db/postgres/migraciones/049_inscripcion_catedra.sql:/docker-entrypoint-initdb.d/z049_inscripcion_catedra.sql:ro
      - ./db/postgres/migraciones/050_disponibilidad_sesiones.sql:/docker-entrypoint-initdb.d/z050_disponibilidad_sesiones.sql:ro
      - ./db/postgres/migraciones/051_qr_sesion.sql:/docker-entrypoint-initdb.d/z051_qr_sesion.sql:ro
      - ./db/postgres/migraciones/052_primer_ingreso_estudiante.sql:/docker-entrypoint-initdb.d/z052_primer_ingreso_estudiante.sql:ro
      - ./db/postgres/migraciones/053_qr_canal_por_modalidad.sql:/docker-entrypoint-initdb.d/z053_qr_canal_por_modalidad.sql:ro
      - ./db/postgres/migraciones/054_sin_inscripcion_ni_cupo_login_admin.sql:/docker-entrypoint-initdb.d/z054_sin_inscripcion_ni_cupo_login_admin.sql:ro

    # Docker pregunta cada 5 s si PostgreSQL ya acepta conexiones. Cuando
    # responde OK, el servicio pasa a 'healthy' y la API puede arrancar.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d bdcatedras_postgres_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ======================================================================
  #  API .NET (ASP.NET Core, con dotnet watch)
  # ======================================================================
  api:
    # Construye la imagen a partir del Dockerfile de la carpeta de la API.
    build:
      context: ./api_catedras
      dockerfile: Dockerfile

    container_name: mi_v1_catedras_api
    restart: unless-stopped

    # La API NO arranca hasta que 'postgres' esté 'healthy' (y por tanto
    # ya sembrado). Es el mecanismo del Art. 5 / decisión D6.
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8042
      # Sobrescribe ConnectionStrings:Postgres de appsettings.json. Aquí el
      # host es 'postgres' (nombre del servicio en la red de Docker) y el
      # puerto es el 5432 interno.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=bdcatedras_postgres_local;Username=sa;Password=Construccion123!;Include Error Detail=true"

    # La API escucha en 8042 dentro del contenedor; se publica como 8142.
    ports:
      - "8142:8042"

    volumes:
      # 1) El código, montado en caliente: guardar un .cs -> dotnet watch
      #    recompila y reinicia.
      - ./api_catedras:/app
      # 2) 'bin/' y 'obj/' en volúmenes ANÓNIMOS: los compilados de Linux
      #    (contenedor) NO se mezclan con los de Windows (tu IDE).
      - /app/bin
      - /app/obj
      - /app/pruebas/bin
      - /app/pruebas/obj

  # ======================================================================
  #  Front Flask (server-side rendering, consume 'api' por HTTP)
  # ======================================================================
  front:
    # Construye la imagen a partir del Dockerfile de la carpeta del front.
    build:
      context: ./front_catedras
      dockerfile: Dockerfile

    container_name: mi_v1_catedras_front
    restart: unless-stopped

    # El front hace requests HTTP a la API en cada petición del usuario
    # (no al arrancar), así que basta con que el contenedor 'api' ya esté
    # levantado, no necesitamos esperar un healthcheck suyo.
    depends_on:
      - api

    environment:
      # OJO: dentro de la red de Docker el front NO usa 'localhost:8142'
      # (ese es el puerto publicado al host). Usa el nombre del servicio
      # 'api' y el puerto INTERNO 8042, igual que hace 'api' con 'postgres'.
      API_BASE_URL: "http://api:8042/api"
      FLASK_ENV: development
      # v7.1 · RF-S6: correo real para el código de recuperación de clave.
      # Los valores salen de un archivo '.env' junto a este compose (o de tu
      # entorno); vacíos = correo apagado. Ver README, "Subversión v7.1" y
      # front_catedras/env.ejemplo. Nunca pongas credenciales aquí.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SEGURIDAD: "${SMTP_SEGURIDAD:-starttls}"
      SMTP_USUARIO: "${SMTP_USUARIO:-}"
      SMTP_CLAVE: "${SMTP_CLAVE:-}"
      SMTP_REMITENTE: "${SMTP_REMITENTE:-}"
      SMTP_NOMBRE_REMITENTE: "${SMTP_NOMBRE_REMITENTE:-Cátedras USB}"
      URL_PUBLICA: "${URL_PUBLICA:-}"
      CORREO_MODO_CONSOLA: "${CORREO_MODO_CONSOLA:-}"

    # Flask escucha en 5000 dentro del contenedor; se publica como 5000.
    # Si choca con el proyecto del curso, súbelo a 5100 (mismo patrón +100
    # que 'postgres' y 'api').
    ports:
      - "5000:5000"

    volumes:
      # El código, montado en caliente: run.py corre con debug=True, así
      # que guardar un .py reinicia el servidor de desarrollo de Flask.
      - ./front_catedras:/app

volumes:
  # Datos de PostgreSQL. Con el 'name' del proyecto, el volumen real se
  # llama 'mi_v1_catedras_pgdata'.
  pgdata: