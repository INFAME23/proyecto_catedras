{% extends 'base.html' %}
{% block titulo %}Escribe el código · Cátedras USB{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm animate-fade-in">
            <div class="card-body p-4">
                <div class="text-center mb-3">
                    <i class="fas fa-key fa-3x text-primary-custom mb-2"></i>
                    <h1 class="h4 fw-bold mb-1">Escribe el código</h1>
                    <p class="text-muted small mb-0">Paso 2 de 2 · El código vence en pocos minutos y sirve una sola vez.</p>
                </div>

                <form method="post" action="{{ url_for('perfil.recuperar_codigo') }}">
                    <div class="mb-3">
                        <label class="form-label" for="codigo">Código recibido por correo</label>
                        <input type="text" class="form-control form-control-lg text-center font-monospace" id="codigo" name="codigo"
                               required autofocus autocomplete="one-time-code" inputmode="numeric" maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="clave_nueva">Clave nueva</label>
                        <input type="password" class="form-control" id="clave_nueva" name="clave_nueva" required
                               minlength="8" autocomplete="new-password">
                        <div class="form-text">Mínimo 8 caracteres.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="clave_confirmacion">Repite la clave nueva</label>
                        <input type="password" class="form-control" id="clave_confirmacion" name="clave_confirmacion" required
                               minlength="8" autocomplete="new-password">
                    </div>
                    <button class="btn btn-primary w-100" type="submit"><i class="fas fa-save me-1"></i>Cambiar mi clave</button>
                </form>

                <hr>
                <p class="small text-muted mb-0 text-center">
                    ¿No te llegó? Revisa el spam o <a href="{{ url_for('perfil.recuperar') }}">pide otro código</a>.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
