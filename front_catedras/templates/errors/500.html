{% extends 'base.html' %}
{% block titulo %}500 · Error interno{% endblock %}
{% block contenido %}
<div class="card shadow-sm animate-fade-in">
    <div class="card-body text-center py-5">
        <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
        <h1 class="h3 fw-bold">500 — Error interno</h1>
        <p class="text-muted">Algo falló en el front. Si acabas de guardar un formulario, verifica
        que ApiCatedras esté corriendo (<code>docker compose ps</code>).</p>
        <a class="btn btn-outline-primary mt-2" href="{{ url_for('catedras.inicio') }}">
            <i class="fas fa-arrow-left me-1"></i>Volver al inicio
        </a>
    </div>
</div>
{% endblock %}
